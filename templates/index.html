<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume PDF Generator</title>
  <style>
    @font-face {
      font-family: 'ResumeFont';
      src: url('{{ url_for("static", filename="fonts/Carlito-Regular.ttf") }}') format('truetype');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'ResumeFont';
      src: url('{{ url_for("static", filename="fonts/Carlito-Bold.ttf") }}') format('truetype');
      font-weight: 700;
      font-style: normal;
    }

    @font-face {
      font-family: 'ResumeFont';
      src: url('{{ url_for("static", filename="fonts/Carlito-Italic.ttf") }}') format('truetype');
      font-weight: 400;
      font-style: italic;
    }

    @font-face {
      font-family: 'ResumeFont';
      src: url('{{ url_for("static", filename="fonts/Carlito-BoldItalic.ttf") }}') format('truetype');
      font-weight: 700;
      font-style: italic;
    }

    :root {
      --navy: #1F2D3D;
      --gray: #3A3A3A;
      --link: #1F4E8C;
      --line: #AAAAAA;
      --bg: #F1F3F6;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--gray);
      display: flex;
      flex-direction: column;
    }

    header.appbar {
      padding: 12px 20px;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }

    header.appbar h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
    }

    header.appbar .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button#generateBtn {
      background: white;
      color: var(--navy);
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button#generateBtn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      font-size: 12px;
      color: #dfe6ee;
      min-width: 120px;
    }

    #status.error {
      color: #ffb3b3;
    }

    #status.ok {
      color: #b7f0c9;
    }

    /* Mobile tab toggle (hidden on desktop) */
    .tabbar {
      display: none;
      background: var(--panel);
      border-bottom: 1px solid #ddd;
    }

    .tabbar button {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 13px;
      font-weight: 600;
      color: #888;
      border-bottom: 3px solid transparent;
    }

    .tabbar button.active {
      color: var(--navy);
      border-bottom: 3px solid var(--navy);
    }

    .layout {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    .editor-pane {
      width: 42%;
      min-width: 320px;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      padding: 24px;
      /* background: var(--panel);
      border-right: 1px solid #ddd; */
    }

    .editor-pane textarea {
      flex: 1;
      width: 100%;
      font-family: "SF Mono", Consolas, Monaco, monospace;
      font-size: 12.5px;
      line-height: 1.5;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      resize: none;
      background: #fafbfc;
    }

    .editor-pane .hint {
      font-size: 11.5px;
      color: #888;
      margin: 0;
      margin-top: 6px;
    }

    #jsonError {
      font-size: 12px;
      color: #B00020;
      background: #ffecec;
      border: 1px solid #ffc7c7;
      border-radius: 5px;
      padding: 6px 10px;
      margin-bottom: 8px;
      display: none;
    }

    .preview-pane {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    /* The "page" mimics US Letter proportions at 96dpi (8.5in = 816px),
     using pt-based font sizes so it matches the PDF's real point sizes. */
    #page {
      width: 816px;
      max-width: 100%;
      background: white;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(0, 0, 0, 0.03);
      padding: 30.7pt 41.3pt 28pt 41.3pt;
      /* matches 460/420/620/620 twip margins */
      font-family: 'ResumeFont', sans-serif;
      color: var(--gray);
      overflow: auto;
      border-radius: 6px;
    }

    #page h1.name {
      text-align: center;
      color: var(--navy);
      font-weight: 700;
      font-size: 18pt;
      margin: 0 0 2pt 0;
    }

    #page .title {
      text-align: center;
      font-weight: 700;
      font-size: 10.5pt;
      color: var(--gray);
      margin: 2pt 0 3pt 0;
    }

    #page .contact,
    #page .links {
      text-align: center;
      font-size: 8.5pt;
      margin: 0 0 1.5pt 0;
    }

    #page a {
      color: var(--link);
      text-decoration: underline;
    }

    #page hr.top-divider {
      border: none;
      border-top: 0.75pt solid var(--line);
      margin: 4pt 0 4pt 0;
    }

    #page .section-heading {
      color: var(--navy);
      font-weight: 700;
      font-size: 9.5pt;
      text-transform: uppercase;
      margin: 6.5pt 0 1pt 0;
      border-bottom: 0.75pt solid var(--navy);
      padding-bottom: 2pt;
    }

    #page .body-text {
      font-size: 9pt;
      line-height: 1.32;
      margin: 0 0 2pt 0;
    }

    #page .skill-line {
      font-size: 9pt;
      line-height: 1.32;
      margin: 0 0 1pt 0;
    }

    #page .skill-line b {
      color: var(--navy);
    }

    #page .job-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: 4.5pt;
    }

    #page .job-title {
      font-weight: 700;
      color: var(--navy);
      font-size: 9.5pt;
    }

    #page .job-dates {
      font-weight: 700;
      color: var(--gray);
      font-size: 8.5pt;
      white-space: nowrap;
    }

    #page .company {
      font-style: italic;
      font-size: 8.5pt;
      margin: 0 0 1.5pt 0;
    }

    #page ul.bullets {
      margin: 0 0 0 12pt;
      padding: 0;
    }

    #page ul.bullets li {
      font-size: 9pt;
      line-height: 1.32;
      margin-bottom: 1pt;
    }

    #page .project-line {
      font-size: 9pt;
      line-height: 1.32;
      margin: 0 0 1.5pt 0;
    }

    #page .project-line i {
      font-size: 8pt;
    }

    #page .edu-line,
    #page .lang-line {
      font-style: italic;
      font-size: 8.5pt;
      margin: 0 0 1.5pt 0;
    }

    #page .ref-line {
      font-size: 8pt;
    }

    /* --- Responsive: stack on mobile, tab-toggle between editor/preview --- */
    @media (max-width: 900px) {
      .tabbar {
        display: flex;
      }

      .layout {
        flex-direction: column;
      }

      .editor-pane {
        width: 100%;
        max-width: none;
        border-right: none;
        border-bottom: 1px solid #ddd;
        height: 95vh;
        padding: 14px;
      }

      .editor-pane textarea {
        font-size: 12px;
      }

      .preview-pane {
        padding: 12px;
      }

      #page {
        width: 100%;
        padding: 20pt 18pt;
      }

      .layout.showEditorOnly .preview-pane {
        display: none;
      }

      .layout.showPreviewOnly .editor-pane {
        display: none;
      }
    }
  </style>
</head>

<body>

  <header class="appbar">
    <h1>Resume PDF Generator</h1>
    <div class="actions">
      <span id="status"></span>
      <button id="generateBtn">Generate &amp; Download PDF</button>
    </div>
  </header>

  <div class="tabbar">
    <button id="tabEditor" class="active">Edit</button>
    <button id="tabPreview">Preview</button>
  </div>

  <div class="layout showEditorOnly" id="layout">
    <div class="editor-pane">
      <div id="jsonError"></div>
      <textarea id="resumeJson" spellcheck="false">{{ resume_json }}</textarea>
      <p class="hint">Edits update the preview instantly and save to resume-data.json when you generate a PDF.</p>
    </div>

    <div class="preview-pane">
      <div id="page"></div>
    </div>
  </div>

  <script>
    const textarea = document.getElementById('resumeJson');
    const pageEl = document.getElementById('page');
    const jsonErrorEl = document.getElementById('jsonError');
    const statusEl = document.getElementById('status');
    const generateBtn = document.getElementById('generateBtn');
    const layoutEl = document.getElementById('layout');
    const tabEditor = document.getElementById('tabEditor');
    const tabPreview = document.getElementById('tabPreview');

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str == null ? '' : String(str);
      return d.innerHTML;
    }

    function linkHtml(text, url) {
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(text)}</a>`;
    }

    function renderPreview(data) {
      const links = (data.links || []).map(l => linkHtml(l.text, l.url)).join('  |  ');
      const emailLink = data.email ? linkHtml(data.email, 'mailto:' + data.email) : '';

      let html = '';
      html += `<h1 class="name">${escapeHtml(data.name || '')}</h1>`;
      html += `<div class="title">${escapeHtml(data.title || '')}</div>`;
      html += `<div class="contact">${escapeHtml(data.location || '')}  |  ${escapeHtml(data.phone || '')}  |  ${emailLink}</div>`;
      html += `<div class="links">${links}</div>`;
      // html += `<hr class="top-divider">`;

      html += `<div class="section-heading">Summary</div>`;
      html += `<p class="body-text">${escapeHtml(data.summary || '')}</p>`;

      html += `<div class="section-heading">Core Skills</div>`;
      (data.skills || []).forEach(s => {
        html += `<div class="skill-line"><b>${escapeHtml(s.label)}:</b> ${escapeHtml(s.value)}</div>`;
      });

      html += `<div class="section-heading">Work Experience</div>`;
      (data.experience || []).forEach(job => {
        html += `<div class="job-row"><span class="job-title">${escapeHtml(job.title)}</span><span class="job-dates">${escapeHtml(job.dates)}</span></div>`;
        let companyLine = escapeHtml(job.company || '');
        if (job.companyLink) {
          companyLine += ` (${linkHtml(job.companyLink.text, job.companyLink.url)})`;
        }
        html += `<div class="company">${companyLine}</div>`;
        html += `<ul class="bullets">`;
        (job.bullets || []).forEach(b => { html += `<li>${escapeHtml(b)}</li>`; });
        html += `</ul>`;
      });

      html += `<div class="section-heading">Key Projects</div>`;
      (data.projects || []).forEach(p => {
        const titleHtml = p.link ? linkHtml(p.title, p.link) : `<b style="color:var(--navy)">${escapeHtml(p.title)}</b>`;
        html += `<div class="project-line">${titleHtml}: ${escapeHtml(p.description)} <i>Stack: ${escapeHtml(p.stack)}</i></div>`;
      });

      html += `<div class="section-heading">Education &amp; Languages</div>`;
      const eduText = (data.education || []).map(e => `${escapeHtml(e.degree)} — ${escapeHtml(e.school)}`).join('   |   ');
      html += `<div class="edu-line">${eduText}</div>`;
      html += `<div class="lang-line">${escapeHtml(data.languages || '')}</div>`;

      html += `<div class="section-heading">References</div>`;
      const refText = (data.references || []).map(r => `${escapeHtml(r.name)} — ${escapeHtml(r.title)} — ${escapeHtml(r.email)}`).join('   |   ');
      html += `<div class="ref-line">${refText}</div>`;

      pageEl.innerHTML = html;
    }

    let debounceTimer = null;
    function scheduleUpdate() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        try {
          const data = JSON.parse(textarea.value);
          renderPreview(data);
          jsonErrorEl.style.display = 'none';
        } catch (e) {
          jsonErrorEl.textContent = 'JSON error (preview frozen until fixed): ' + e.message;
          jsonErrorEl.style.display = 'block';
        }
      }, 250);
    }

    textarea.addEventListener('input', scheduleUpdate);
    scheduleUpdate(); // initial render

    // Mobile tab toggle
    tabEditor.addEventListener('click', () => {
      tabEditor.classList.add('active');
      tabPreview.classList.remove('active');
      layoutEl.classList.remove('showPreviewOnly');
      layoutEl.classList.add('showEditorOnly');
    });
    tabPreview.addEventListener('click', () => {
      tabPreview.classList.add('active');
      tabEditor.classList.remove('active');
      layoutEl.classList.remove('showEditorOnly');
      layoutEl.classList.add('showPreviewOnly');
    });

    // Generate & download
    generateBtn.addEventListener('click', async () => {
      statusEl.textContent = 'Generating…';
      statusEl.className = '';
      generateBtn.disabled = true;

      try {
        const formData = new FormData();
        formData.append('resume_json', textarea.value);
        const resp = await fetch('/generate', { method: 'POST', body: formData });

        if (!resp.ok) {
          const err = await resp.json().catch(() => ({ error: 'Unknown error' }));
          statusEl.textContent = err.error || 'Failed to generate PDF.';
          statusEl.className = 'error';
          generateBtn.disabled = false;
          return;
        }

        const blob = await resp.blob();
        const disposition = resp.headers.get('Content-Disposition') || '';
        const match = disposition.match(/filename="?([^"]+)"?/);
        const filename = match ? match[1] : 'Resume.pdf';

        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);

        statusEl.textContent = `Downloaded ${filename}`;
        statusEl.className = 'ok';
      } catch (err) {
        statusEl.textContent = 'Network error: ' + err.message;
        statusEl.className = 'error';
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>

</html>
